# Builds the addon zip and uploads it when a version tag is pushed.
# Uploads go only to the sites whose project ID is in BiscuitBreak.toc
# (## X-Curse-Project-ID, ## X-Wago-ID) and whose API key is set as a
# repository secret. GitHub releases need no setup.
name: Release

on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is built from the commit history

      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
